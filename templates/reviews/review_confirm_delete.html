{% extends "base.html" %}
{% load gamecritic_tags %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-20">
    
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 md:p-8 space-y-6 shadow-xl">
        
        
        <div class="bg-red-950/40 border border-red-900/60 rounded-xl p-4 text-base text-white-400">
            Вы уверены, что хотите навсегда удалить обзор на игру 
            <strong class="font-bold text-red-200">«{{ review.title }}»</strong>? 
            Это действие нельзя будет отменить.
        </div>

       
        <form method="POST" class="flex items-center justify-end gap-3 pt-4 border-t border-zinc-800">
            {% csrf_token %}
            
            
            <a href="{% url 'reviews:detail' review.slug %}" 
               class="px-5 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium rounded-xl border border-zinc-700 transition-colors text-sm text-center">
                Отмена
            </a>
            
           
            <button type="submit" 
                    class="px-5 py-2.5 bg-red-800 hover:bg-red-700 text-white font-semibold rounded-xl shadow-sm hover:shadow transition-all text-sm">
                Да, удалить навсегда
            </button>
        </form>
    </div>

</div>
{% endblock content %}
